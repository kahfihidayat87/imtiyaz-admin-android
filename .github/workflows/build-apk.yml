name: Build Admin APK

on:
  push:
    branches: [ main ]
    # Skip build untuk perubahan non-source (docs/config/scripts).
    # Build manual untuk regen APK dari commit docs:
    #   gh workflow run build-apk.yml
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - 'scripts/**'
      - 'logs/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Create local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > android-app/local.properties

      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-app
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Imtiyaz-Admin-Debug-APK
          path: android-app/app/build/outputs/apk/debug/*.apk

      # ============================================================
      # RELEASE SIGNED — hanya jalan kalau 4 secrets keystore terisi
      # ============================================================
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        working-directory: android-app
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build Release APK (signed)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        working-directory: android-app
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Imtiyaz-Admin-Release-APK
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-build${{ github.run_number }}
          name: Imtiyaz Admin v1.1.0 (build ${{ github.run_number }})
          body: |
            APK rilis Imtiyaz Admin versi 1.1.0.
            Dibangun otomatis dari commit ${{ github.sha }}.

            **Untuk internal admin & tour leader.**

            **Cara install:**
            1. Download file APK di bawah
            2. Buka file manager, tap file APK
            3. Izinkan "Install unknown apps" jika diminta
            4. Tap Install
          files: android-app/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
